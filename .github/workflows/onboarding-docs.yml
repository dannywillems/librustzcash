name: Deploy onboarding docs

# Builds the Docusaurus site under `onboarding/` and publishes the
# static output to the ROOT of the `onboarding` branch so that
# GitHub Pages (configured as "Deploy from a branch" -> `onboarding`
# -> `/ (root)`) can serve it directly.
#
# The bot's deploy commit carries `[skip ci]` so it does not
# re-trigger this workflow. A `paths-ignore` block also filters the
# built artefacts as a second line of defence.

on:
  push:
    branches:
      - onboarding
    paths-ignore:
      - 'index.html'
      - '404.html'
      - 'assets/**'
      - 'sitemap.xml'
      - 'opensearch.xml'
      - 'manifest.json'
      - 'search-index-*.json'
      - 'katex/**'
      - 'img/**'
      - 'styles.*.css'
      - 'runtime~main.*.js'
      - 'main.*.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-onboarding-docs
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    name: Build and deploy site to onboarding branch root
    # ubuntu-latest is a moving alias to the newest supported Ubuntu
    # runner image; GitHub bumps it as new LTS versions roll out.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        # actions/checkout v6.0.2 (latest as of 2026-05). SHA-pinned
        # per supply-chain best practice; the trailing comment is the
        # human-readable tag for upgrades.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        # actions/setup-node v6.4.0 (latest as of 2026-05). SHA-pinned.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Node 24 is the current active LTS (until 2028-04-30). Node
          # 20 left Active LTS on 2026-04-30. Docusaurus 3.10 requires
          # Node >=20 so this is a strict upgrade.
          node-version: 24

      - name: Install dependencies
        working-directory: onboarding
        run: npm install

      - name: Build Docusaurus site
        working-directory: onboarding
        run: npx docusaurus build

      - name: Publish to onboarding branch root
        env:
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: 'github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: 'github-actions[bot]@users.noreply.github.com'
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Move the just-built site aside so it survives the working
          # tree operations below.
          STAGE=$(mktemp -d)
          cp -a onboarding/build/. "$STAGE/"

          # Wipe previous deploy artefacts at the repo root, but keep
          # the source tree (onboarding/, .github/, Cargo.toml, etc.)
          # untouched. The list mirrors what Docusaurus emits.
          rm -f index.html 404.html sitemap.xml opensearch.xml \
                manifest.json robots.txt
          rm -f search-index-*.json
          rm -rf assets katex img

          # Remove stale per-chapter route directories (kebab-case
          # slugs derived from the Markdown filenames). The grep here
          # lists every top-level directory whose name matches the
          # slug shape that Docusaurus produces for `docs/*.md`.
          for d in *-*/ ; do
            case "$d" in
              # Never touch source paths.
              onboarding/|components/|pczt/|zcash/|zcash_*/) ;;
              *)
                if [ -d "$d" ] && [ -f "$d/index.html" ]; then
                  rm -rf -- "$d"
                fi
                ;;
            esac
          done

          # Overlay the fresh build output at the repo root.
          cp -a "$STAGE/." ./

          # Configure git and stage the result.
          git config user.name  "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add -A

          if git diff --staged --quiet; then
            echo "No site changes; nothing to deploy."
            exit 0
          fi

          git commit -m "docs: deploy onboarding site [skip ci]" \
                     -m "Built from ${SOURCE_SHA} on the onboarding branch."
          git push origin HEAD:onboarding
